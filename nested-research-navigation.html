<script>
/* Nested, collapsible lab navigation for the Quarto Book sidebar.
 * Quarto Book chapters remain unchanged; this groups each lab's note links
 * beneath its lab landing page. Closed by default on a first visit.
 */
(function () {
  "use strict";
  const labs = [
    { directory: "/research/computational-plasma-dynamics-lab/", label: "Computational Plasma Dynamics Lab", key: "computational-plasma-dynamics-lab" },
    { directory: "/research/plasmawise/", label: "PLASMAWISE", key: "plasmawise" },
    { directory: "/research/rotating-detonation-engines-lab/", label: "Rotating Detonation Engines Lab", key: "rotating-detonation-engines-lab" }
  ];
  function linkPath(link) {
    try { return new URL(link.href, document.baseURI).pathname; }
    catch (_) { return ""; }
  }
  function initialize() {
    const sidebar = document.querySelector("#quarto-sidebar .sidebar-menu-container");
    if (!sidebar) return;
    for (const lab of labs) {
      const links = sidebar.querySelectorAll("li.sidebar-item > .sidebar-item-container > a.sidebar-link");
      const labLink = Array.from(links).find(link => linkPath(link).endsWith(lab.directory + "index.html"));
      if (!labLink) continue;
      const labItem = labLink.closest("li.sidebar-item");
      if (!labItem || labItem.dataset.labMenuInitialized === "true") continue;

      const notes = [];
      let sibling = labItem.nextElementSibling;
      while (sibling && sibling.matches("li.sidebar-item")) {
        const noteLink = sibling.querySelector(":scope > .sidebar-item-container > a.sidebar-link");
        const path = noteLink ? linkPath(noteLink) : "";
        if (!path.includes(lab.directory) || path.endsWith(lab.directory + "index.html")) break;
        notes.push(sibling);
        sibling = sibling.nextElementSibling;
      }
      if (!notes.length) continue;
      const container = labItem.querySelector(":scope > .sidebar-item-container");
      const title = container && container.querySelector(".menu-text");
      if (!container || !title) continue;

      const id = "research-lab-notes-" + lab.key;
      title.id = id + "-label";
      const list = document.createElement("ul");
      list.id = id;
      list.className = "list-unstyled sidebar-section depth2 research-lab-children";
      list.setAttribute("aria-labelledby", title.id);
      notes.forEach(note => list.appendChild(note));

      const toggle = document.createElement("button");
      toggle.type = "button";
      toggle.className = "sidebar-item-toggle research-lab-toggle";
      toggle.setAttribute("aria-controls", id);
      toggle.setAttribute("aria-label", "Show or hide notes under " + lab.label);
      toggle.innerHTML = '<i class="bi bi-chevron-right" aria-hidden="true"></i>';

      const storageKey = "philosophia-naturalis:lab-menu:" + lab.key;
      let initiallyOpen = false;
      try { initiallyOpen = sessionStorage.getItem(storageKey) === "open"; } catch (_) {}
      function setOpen(open) {
        list.hidden = !open;
        toggle.setAttribute("aria-expanded", String(open));
      }
      setOpen(initiallyOpen);
      toggle.addEventListener("click", function () {
        const open = list.hidden;
        setOpen(open);
        try { sessionStorage.setItem(storageKey, open ? "open" : "closed"); } catch (_) {}
      });

      labItem.classList.add("sidebar-item-section", "research-lab-item");
      labItem.dataset.labMenuInitialized = "true";
      container.appendChild(toggle);
      labItem.appendChild(list);
    }
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", initialize);
  else initialize();
  window.addEventListener("load", initialize);
  window.addEventListener("pageshow", initialize);
})();
</script>
