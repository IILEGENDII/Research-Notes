<script>
/* Allow labs to expand/collapse within Quarto Book's chapter sidebar.
   Parts are not nested in the book chapter model: organize their HTML links here
   while retaining book cross-references and chapter ordering. */
(function () {
  "use strict";
  const labSections = [
    { directory: "/research/computational-plasma-dynamics-lab/", label: "Computational Plasma Dynamics Lab", key: "computational-plasma-dynamics-lab" },
    { directory: "/research/plasmawise/", label: "PLASMAWISE", key: "plasmawise" },
    { directory: "/research/rotating-detonation-engines-lab/", label: "Rotating Detonation Engines Lab", key: "rotating-detonation-engines-lab" }
  ];
  function getPath(anchor) {
    try { return new URL(anchor.href, document.baseURI).pathname; }
    catch (_) { return ""; }
  }
  function setup() {
    const menu = document.querySelector("#quarto-sidebar .sidebar-menu-container");
    if (!menu) return;
    for (const lab of labSections) {
      const anchors = menu.querySelectorAll("li.sidebar-item > .sidebar-item-container > a.sidebar-link");
      const labLink = Array.from(anchors).find(a => getPath(a).endsWith(lab.directory + "index.html"));
      if (!labLink) continue;
      const labItem = labLink.closest("li.sidebar-item");
      if (!labItem || labItem.classList.contains("sidebar-item-section")) continue;
      const childItems = [];
      let sibling = labItem.nextElementSibling;
      while (sibling && sibling.matches("li.sidebar-item")) {
        const link = sibling.querySelector(":scope > .sidebar-item-container > a.sidebar-link");
        const url = link ? getPath(link) : "";
        if (!url.includes(lab.directory) || url.endsWith(lab.directory + "index.html")) break;
        childItems.push(sibling);
        sibling = sibling.nextElementSibling;
      }
      if (childItems.length === 0) continue;
      const container = labItem.querySelector(":scope > .sidebar-item-container");
      const title = container && container.querySelector(".menu-text");
      if (!container || !title) continue;
      const id = "quarto-lab-section-" + lab.key;
      title.id = id + "-label";
      const expanded = labLink.classList.contains("active") || childItems.some(item => !!item.querySelector("a.sidebar-link.active"));
      const list = document.createElement("ul");
      list.id = id;
      list.className = "collapse list-unstyled sidebar-section depth2" + (expanded ? " show" : "");
      list.setAttribute("aria-labelledby", title.id);
      for (const child of childItems) list.appendChild(child);
      const toggle = document.createElement("button");
      toggle.type = "button";
      toggle.className = "sidebar-item-toggle text-start";
      toggle.setAttribute("data-bs-toggle", "collapse");
      toggle.setAttribute("data-bs-target", "#" + id);
      toggle.setAttribute("aria-controls", id);
      toggle.setAttribute("aria-expanded", String(expanded));
      toggle.setAttribute("aria-label", "Toggle section: " + lab.label);
      toggle.innerHTML = '<i class="bi bi-chevron-right ms-2" aria-hidden="true"></i>';
      labItem.classList.add("sidebar-item-section");
      container.appendChild(toggle);
      labItem.appendChild(list);
    }
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", setup);
  else setup();
})();
</script>
