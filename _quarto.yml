project:
  type: book
  output-dir: _book

book:
  title: "Philosophia Naturalis"
  subtitle: "Understanding the cosmos, one step at a time..."
  favicon: phi-favicon-v2.svg
  site-url: "https://IILEGENDII.github.io/Research-Notes/"
  repo-actions: none
  page-navigation: true
  reader-mode: true
  sidebar:
    search: true
    style: docked
    tools:
      - icon: translate
        text: "Translate page"
        aria-label: "Translate page"
        menu:
          - text: "Open Google Translate (JavaScript required for full language selector)"
            href: "https://translate.google.com/"
            target: _blank
  chapters:
    - href: index.qmd
      text: "Introduction"
    - part: research/index.qmd
      chapters:
        - research/computational-plasma-dynamics-lab/index.qmd
        - research/computational-plasma-dynamics-lab/derivations-for-collision-operators.qmd
        - research/plasmawise/index.qmd
        - research/rotating-detonation-engines-lab/index.qmd
    - part: courses/index.qmd
      chapters: []
    - part: coding/index.qmd
      chapters: []

bibliography: references.bib

format:
  html:
    theme:
      - litera
      - styles.scss
    toc: true
    toc-depth: 3
    number-sections: true
    code-copy: true
    html-math-method: mathjax
    link-external-newwindow: true
    include-in-header: translate-current-page.html
    include-after-body: nested-research-navigation.html

execute:
  freeze: auto
